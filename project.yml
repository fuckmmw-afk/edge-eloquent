name: EdgeEloquent
options:
  bundleIdPrefix: com.edgeeloquent
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  EdgeEloquent:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/EdgeEloquent
      - path: Sources/EdgeEloquentApp
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: "EdgeEloquent"
        PRODUCT_BUNDLE_IDENTIFIER: "com.edgeeloquent.app"
        INFOPLIST_FILE: "Resources/Info.plist"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
